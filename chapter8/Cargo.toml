[package]
name = "chapter8"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
bevy_procedural_tilemaps = "0.4.0"
bevy_common_assets = { version = "0.17", features = ["ron"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
pathfinding = "4.9"

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies
[profile.dev.package."*"]
opt-level = 3
